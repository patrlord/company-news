<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<title>Company news</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 1100px;
         margin: 48px auto; padding: 0 24px; color: #1a1a1a; }
  input { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px;
          box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 9px 16px; font-size: 14px; border: none;
           border-radius: 6px; background: #1a1a1a; color: white; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: #666; font-size: 13px; }
  .status { margin-top: 8px; font-size: 13px; min-height: 1.2em; color: #666; }
  .status.error { color: #b3261e; }
  #topbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }

  .reminder-banner { display: flex; align-items: center; justify-content: space-between; gap: 14px;
                      background: #fff6e5; border: 1px solid #f0c368; border-radius: 8px;
                      padding: 10px 14px; margin: 4px 0 16px; font-size: 13.5px; color: #6b4a00; }
  .reminder-banner button { flex-shrink: 0; padding: 6px 14px; font-size: 12.5px; }

  #layout { display: flex; gap: 24px; align-items: flex-start; }
  #left-pane { flex: 0 0 300px; min-width: 0;
               position: sticky; top: 24px; max-height: calc(100vh - 48px);
               display: flex; flex-direction: column; }
  #right-pane { flex: 1; min-width: 0; }
  @media (max-width: 720px) {
    #layout { flex-direction: column; }
    #left-pane { flex: 1; width: 100%; position: static; max-height: none; }
    #left-pane-list { overflow-y: visible !important; }
  }

  #add-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; flex-shrink: 0; }
  #add-row .add-inputs { display: flex; gap: 6px; }
  #add-row input[name="company"] { flex: 2; }
  #add-row input[name="extra"] { flex: 3; }

  #left-pane-list { overflow-y: auto; min-height: 0; }

  ul.company-list { list-style: none; margin: 0; padding: 0; border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden; }
  ul.company-list li { display: flex; align-items: center; gap: 7px; padding: 9px 10px;
                        border-bottom: 1px solid #eee; cursor: pointer; background: white; }
  ul.company-list li:last-child { border-bottom: none; }
  ul.company-list li:hover { background: #fafafa; }
  ul.company-list li.selected { background: #f0f0f0; }
  ul.company-list li.paused { opacity: 0.55; }
  ul.company-list li.drag-over { box-shadow: inset 0 2px 0 #1a1a1a; }
  .drag-handle { color: #bbb; font-size: 13px; cursor: grab; flex-shrink: 0; padding: 0 2px; user-select: none; }
  .watching-checkbox { width: auto; flex-shrink: 0; }
  .company-name { flex: 1; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .new-badge { background: #1a73e8; color: white; font-size: 11px; font-weight: 600;
               line-height: 1; padding: 3px 6px; border-radius: 4px; flex-shrink: 0; }
  .remove-btn { background: none; color: #bbb; font-size: 15px; line-height: 1; padding: 2px 4px;
                border-radius: 4px; flex-shrink: 0; }
  .remove-btn:hover { color: #b3261e; background: #fdecea; }
  .empty-list-note { padding: 14px 10px; font-size: 13px; color: #999; }

  #right-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
  #right-header h3 { margin: 0; font-size: 17px; }
  #right-header label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; flex-shrink: 0; }
  #right-header input[type="checkbox"] { width: auto; }
  .poll-warning { font-size: 12px; color: #b3261e; margin: 4px 0 10px; }
  .key-events { border: 1px solid #eee; border-radius: 8px; padding: 12px 16px; margin: 14px 0; background: #fafafa; }
  .key-events h4 { margin: 0 0 8px; font-size: 12.5px; color: #666; text-transform: uppercase; letter-spacing: 0.02em; }
  .key-events ul { margin: 0; padding-left: 18px; }
  .key-events li { font-size: 13.5px; line-height: 1.5; margin-bottom: 5px; }
  .key-events li:last-child { margin-bottom: 0; }

  .pricing-box { border: 1px solid #eee; border-radius: 8px; padding: 12px 16px; margin: 14px 0; background: #fafafa; }
  .pricing-box h4 { margin: 0 0 8px; font-size: 12.5px; color: #666; text-transform: uppercase; letter-spacing: 0.02em; }
  .pricing-rows { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; }
  .pricing-rows dt { font-size: 13px; color: #666; }
  .pricing-rows dd { margin: 0; font-size: 13.5px; font-weight: 500; }
  .pricing-note { font-size: 13px; color: #555; margin: 4px 0 0; }
  .pricing-source { font-size: 11.5px; color: #999; margin: 8px 0 0; }
  .price-up { color: #1a7a3c; }
  .price-down { color: #b3261e; }

  .item-list { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  .item-list li { border-top: 1px solid #f0f0f0; padding-top: 14px; }
  .item-list li:first-child { border-top: none; padding-top: 0; }
  .item-title-row { display: flex; align-items: baseline; gap: 7px; }
  .item-title { font-size: 14.5px; font-weight: 500; color: #1a1a1a; text-decoration: none; line-height: 1.4; }
  .item-title:hover { text-decoration: underline; }
  .item-new-tag { background: #1a73e8; color: white; font-size: 10px; font-weight: 600;
                  line-height: 1; padding: 2.5px 5px; border-radius: 4px; flex-shrink: 0; white-space: nowrap; }
  .item-meta { font-size: 12px; color: #888; margin-top: 3px; }
  .item-summary { font-size: 13px; color: #555; margin-top: 5px; line-height: 1.45; }
  .empty-note { font-size: 13px; color: #999; }
  .no-selection { color: #999; font-size: 14px; padding-top: 8px; }
  .denied { max-width: 420px; }
</style>
</head>
<body>
<div id="app"><p>Loading…</p></div>
<script type="module">
  const SUPABASE_URL = "https://eyejmvryyiaymrlenhxa.supabase.co";
  const API_BASE = `${SUPABASE_URL}/functions/v1/company-news`;

  const app = document.getElementById("app");

  // No login on this page — access is a fixed named token in the URL
  // (?user=patrick), checked server-side against a small fixed roster.
  // Read once at load; every request carries it.
  const currentUser = new URLSearchParams(location.search).get("user");

  // In-memory page state — companies (in display order) and which one is
  // shown in the right pane.
  let companies = [];
  let selectedFeedId = null;

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "text") node.textContent = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value);
    }
    for (const child of children) node.appendChild(child);
    return node;
  }

  async function postAction(payload) {
    try {
      const res = await fetch(API_BASE, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...payload, user: currentUser }),
      });
      let data;
      try {
        data = await res.json();
      } catch {
        return { ok: false, error: `HTTP ${res.status}` };
      }
      if (!res.ok) return { ok: false, error: data.error || `HTTP ${res.status}` };
      return { ok: true, data };
    } catch (err) {
      return { ok: false, error: err.message || "network error" };
    }
  }

  function formatDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function formatSource(source) {
    return (source || "").replace(/^www\./, "");
  }

  function renderItemRow(item) {
    const parts = [formatSource(item.source), formatDate(item.published_at || item.captured_at)].filter(Boolean);
    const titleRow = [
      item.url
        ? el("a", { class: "item-title", href: item.url, target: "_blank", rel: "noopener noreferrer", text: item.title || "Untitled" })
        : el("div", { class: "item-title", text: item.title || "Untitled" }),
    ];
    if (item.new) titleRow.push(el("span", { class: "item-new-tag", text: "NEW" }));
    const children = [
      el("div", { class: "item-title-row" }, titleRow),
      el("div", { class: "item-meta", text: parts.join(" · ") }),
    ];
    if (item.summary) children.push(el("div", { class: "item-summary", text: item.summary }));
    return el("li", {}, children);
  }

  // ---- Left pane: draggable, removable, selectable company list ----

  let dragFromIndex = null;

  function renderLeftList(container) {
    container.innerHTML = "";
    if (!companies.length) {
      container.appendChild(el("div", { class: "empty-list-note", text: "No companies yet — add one above." }));
      return;
    }

    const listEl = el("ul", { class: "company-list" });
    companies.forEach((entry, index) => {
      const li = el("li", {
        draggable: "true",
        onclick: () => {
          selectedFeedId = entry.feed_id;
          renderLeftList(container);
          renderRightPane();
        },
        ondragstart: (e) => {
          dragFromIndex = index;
          e.dataTransfer.effectAllowed = "move";
        },
        ondragover: (e) => {
          e.preventDefault();
          li.classList.add("drag-over");
        },
        ondragleave: () => li.classList.remove("drag-over"),
        ondrop: async (e) => {
          e.preventDefault();
          li.classList.remove("drag-over");
          if (dragFromIndex === null || dragFromIndex === index) return;
          const [moved] = companies.splice(dragFromIndex, 1);
          companies.splice(index, 0, moved);
          dragFromIndex = null;
          renderLeftList(container);
          const result = await postAction({ action: "reorder_companies", feed_ids: companies.map((c) => c.feed_id) });
          if (!result.ok) {
            // Order still shown locally even if the save failed — a reload
            // will revert to the last saved order, which is an acceptable
            // way to surface the failure without a blocking error dialog.
          }
        },
        ondragend: () => {
          dragFromIndex = null;
          container.querySelectorAll("li.drag-over").forEach((n) => n.classList.remove("drag-over"));
        },
      });
      if (entry.feed_id === selectedFeedId) li.classList.add("selected");
      if (!entry.active) li.classList.add("paused");

      const watchCheckbox = el("input", {
        type: "checkbox",
        class: "watching-checkbox",
        title: "Watching",
        ...(entry.active ? { checked: "checked" } : {}),
        onclick: (e) => e.stopPropagation(),
        onchange: async (e) => {
          e.stopPropagation();
          e.target.disabled = true;
          const result = await postAction({ action: "toggle_company", feed_id: entry.feed_id, active: e.target.checked });
          if (result.ok) {
            entry.active = e.target.checked;
            renderLeftList(container);
            if (selectedFeedId === entry.feed_id) renderRightPane();
          } else {
            e.target.checked = !e.target.checked;
            e.target.disabled = false;
          }
        },
      });

      const removeBtn = el("button", {
        class: "remove-btn",
        text: "×",
        title: "Remove company",
        onclick: async (e) => {
          e.stopPropagation();
          removeBtn.disabled = true;
          const result = await postAction({ action: "remove_company", feed_id: entry.feed_id });
          if (!result.ok) {
            removeBtn.disabled = false;
            return;
          }
          companies = companies.filter((c) => c.feed_id !== entry.feed_id);
          if (selectedFeedId === entry.feed_id) {
            selectedFeedId = companies[0]?.feed_id ?? null;
          }
          renderLeftList(container);
          renderRightPane();
        },
      });

      const rowChildren = [
        el("span", { class: "drag-handle", text: "⠿" }),
        watchCheckbox,
        el("span", { class: "company-name", text: entry.company }),
      ];
      if (entry.new_count > 0) {
        rowChildren.push(el("span", { class: "new-badge", title: "Items collected since your last visit", text: `${entry.new_count} new` }));
      }
      rowChildren.push(removeBtn);
      li.append(...rowChildren);
      listEl.appendChild(li);
    });
    container.appendChild(listEl);
  }

  // A one-time manual snapshot (collected via a live browser session, since
  // Forge Global's real pricing data is Cloudflare-protected and not
  // fetchable from a server-side function) — refreshed only on request, not
  // polled. Omit the box entirely when no source was ever found (most
  // companies); still show it, with just the source + note, when Forge
  // lists the company but publishes no price/valuation data.
  function renderPricingBox(snapshot, updatedAt) {
    if (!snapshot || !snapshot.source) return null;
    const rows = [];
    if (snapshot.forge_price) {
      const change = snapshot.forge_price_change ? ` (${snapshot.forge_price_change})` : "";
      rows.push(["Forge Price", `${snapshot.forge_price}${change}`]);
    }
    if (snapshot.implied_valuation) rows.push(["Implied valuation", snapshot.implied_valuation]);
    if (snapshot.last_round) {
      const r = snapshot.last_round;
      rows.push([`Last round — ${r.round}, ${formatDate(r.date)}`, `${r.price_per_share}/share · ${r.post_money_valuation} post-money`]);
    }
    if (snapshot.last_known_valuation) {
      const v = snapshot.last_known_valuation;
      rows.push(["Last known valuation", `${v.amount} (${formatDate(v.as_of)})`]);
    }

    const children = [el("h4", { text: "Secondary pricing (private market)" })];
    if (rows.length) {
      children.push(el("dl", { class: "pricing-rows" }, rows.flatMap(([label, value]) => [
        el("dt", { text: label }),
        el("dd", { text: value }),
      ])));
    }
    if (snapshot.note) children.push(el("p", { class: "pricing-note", text: snapshot.note }));
    children.push(el("p", {
      class: "pricing-source",
      text: `Source: ${snapshot.source}${updatedAt ? ` · as of ${formatDate(updatedAt)}` : ""}`,
    }));
    return el("div", { class: "pricing-box" }, children);
  }

  // Live quote, automatically refreshed hourly by a cron job — only present
  // for the (few) tracked companies that have since IPO'd.
  function renderPublicPriceBox(ticker, snapshot, updatedAt) {
    if (!ticker || !snapshot || typeof snapshot.price !== "number") return null;
    const changeClass = typeof snapshot.change_percent === "number"
      ? (snapshot.change_percent >= 0 ? "price-up" : "price-down")
      : "";
    const changeText = typeof snapshot.change_percent === "number"
      ? ` (${snapshot.change_percent >= 0 ? "+" : ""}${snapshot.change_percent.toFixed(2)}%)`
      : "";
    const priceDd = el("dd", { class: changeClass }, [
      document.createTextNode(`${snapshot.currency || "USD"} ${snapshot.price.toFixed(2)}${changeText}`),
    ]);
    const rows = [el("dt", { text: `${ticker} — public market price` }), priceDd];
    return el("div", { class: "pricing-box" }, [
      el("h4", { text: "Public market price" }),
      el("dl", { class: "pricing-rows" }, rows),
      el("p", { class: "pricing-source", text: `Source: Yahoo Finance${updatedAt ? ` · as of ${formatDate(updatedAt)}` : ""}` }),
    ]);
  }

  // ---- Right pane: selected company's items ----

  function renderRightPane() {
    const container = document.getElementById("right-pane");
    container.innerHTML = "";

    const entry = companies.find((c) => c.feed_id === selectedFeedId);
    if (!entry) {
      container.appendChild(el("p", { class: "no-selection", text: "Select a company on the left to see its recent coverage." }));
      return;
    }

    const toggleStatus = el("span", { class: "hint" });
    const checkbox = el("input", {
      type: "checkbox",
      ...(entry.active ? { checked: "checked" } : {}),
      onchange: async (e) => {
        e.target.disabled = true;
        toggleStatus.textContent = "Saving…";
        const result = await postAction({ action: "toggle_company", feed_id: entry.feed_id, active: e.target.checked });
        if (result.ok) {
          entry.active = e.target.checked;
          toggleStatus.textContent = "";
          const leftContainer = document.getElementById("left-pane-list");
          if (leftContainer) renderLeftList(leftContainer);
        } else {
          toggleStatus.textContent = "Failed — try again";
        }
        e.target.disabled = false;
      },
    });
    const header = el("div", { id: "right-header" }, [
      el("h3", { text: entry.company }),
      el("label", {}, [checkbox, el("span", { text: "watching" }), toggleStatus]),
    ]);

    container.append(header);
    if (entry.last_poll_status === "failed") {
      container.append(el("div", {
        class: "poll-warning",
        text: `Last check failed${entry.last_poll_error ? `: ${entry.last_poll_error}` : ""}`,
      }));
    }
    const publicPriceBox = renderPublicPriceBox(entry.public_ticker, entry.public_price_snapshot, entry.public_price_updated_at);
    if (publicPriceBox) container.append(publicPriceBox);
    const pricingBox = renderPricingBox(entry.pricing_snapshot, entry.pricing_updated_at);
    if (pricingBox) container.append(pricingBox);
    if (entry.key_events && entry.key_events.length) {
      container.append(el("div", { class: "key-events" }, [
        el("h4", { text: "Key events — last 6 months" }),
        el("ul", {}, entry.key_events.map((bullet) => el("li", { text: bullet }))),
      ]));
    }
    container.append(
      entry.items.length
        ? el("ul", { class: "item-list" }, entry.items.map(renderItemRow))
        : el("p", { class: "empty-note", text: "Nothing captured yet." }),
    );
  }

  // ---- Add company ----

  function renderAddRow(leftContainer) {
    const status = el("div", { class: "status" });
    const nameInput = el("input", { name: "company", type: "text", placeholder: "Company name" });
    const extraInput = el("input", { name: "extra", type: "text", placeholder: "Extra keywords (optional, to disambiguate a common name)" });
    const addBtn = el("button", {
      text: "Add",
      onclick: async () => {
        const company = nameInput.value.trim();
        if (!company) return;
        addBtn.disabled = true;
        status.className = "status";
        status.textContent = "Checking for news coverage…";
        const result = await postAction({ action: "add_company", company, extra_keywords: extraInput.value.trim() });
        if (result.ok) {
          companies.push(result.data.company);
          selectedFeedId = result.data.company.feed_id;
          nameInput.value = "";
          extraInput.value = "";
          status.textContent = "";
          renderLeftList(leftContainer);
          renderRightPane();
        } else {
          const labels = {
            duplicate: "already on your list",
            feed_check_failed: "couldn't verify a news feed for that — try adding extra keywords",
            empty_company: "enter a company name",
          };
          status.className = "status error";
          status.textContent = labels[result.error] || `Something went wrong (${result.error}).`;
        }
        addBtn.disabled = false;
      },
    });
    nameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addBtn.click();
    });
    extraInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addBtn.click();
    });

    return el("div", { id: "add-row" }, [
      el("div", { class: "add-inputs" }, [nameInput, extraInput, addBtn]),
      status,
    ]);
  }

  // ---- Pricing reminder banner ----

  function renderReminderBanner() {
    const banner = el("div", { class: "reminder-banner" }, [
      el("span", { text: "Remember to update secondary prices" }),
      el("button", {
        text: "Done",
        onclick: async (e) => {
          e.target.disabled = true;
          const result = await postAction({ action: "dismiss_pricing_reminder" });
          if (result.ok) banner.remove();
          else e.target.disabled = false;
        },
      }),
    ]);
    return banner;
  }

  function renderError(message) {
    app.innerHTML = "";
    app.appendChild(el("p", { text: message }));
  }

  function renderDenied() {
    app.innerHTML = "";
    app.appendChild(el("div", { class: "denied" }, [
      el("h2", { text: "Company news" }),
      el("p", { class: "hint", text: "This link doesn't include a valid access token. Use the link you were given (it looks like ?user=<your name> at the end of the URL)." }),
    ]));
  }

  async function renderApp() {
    app.innerHTML = "<p>Loading…</p>";

    if (!currentUser) {
      renderDenied();
      return;
    }

    let data;
    try {
      const res = await fetch(`${API_BASE}?user=${encodeURIComponent(currentUser)}`);
      if (res.status === 401) {
        renderDenied();
        return;
      }
      data = await res.json();
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    } catch (err) {
      renderError(`Something went wrong loading company news (${err.message || "network error"}) — please reload the page.`);
      return;
    }

    companies = data.companies ?? [];
    if (!selectedFeedId && companies.length) selectedFeedId = companies[0].feed_id;

    app.innerHTML = "";
    const leftList = el("div", { id: "left-pane-list" });
    const leftPane = el("div", { id: "left-pane" }, [renderAddRow(leftList), leftList]);
    const rightPane = el("div", { id: "right-pane" });

    app.append(
      el("div", { id: "topbar" }, [
        el("h2", { text: "Company news" }),
        el("span", { class: "hint", text: data.display_name ? `Viewing as ${data.display_name}` : "" }),
      ]),
      el("p", { class: "hint", text: "Recent coverage per company, from a Bing News search run for each. Drag to reorder, click a company to see its coverage." }),
    );
    if (data.show_pricing_reminder) app.append(renderReminderBanner());
    app.append(el("div", { id: "layout" }, [leftPane, rightPane]));

    renderLeftList(leftList);
    renderRightPane();
  }

  renderApp();
</script>
</body>
</html>
